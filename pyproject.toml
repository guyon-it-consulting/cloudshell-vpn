[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudshell-vpn"
version = "0.1.1"
description = "Free VPN via AWS CloudShell + OpenVPN"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jerome" },
]
keywords = ["vpn", "aws", "cloudshell", "openvpn", "nat-traversal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = [
    "boto3",
    "cryptography",
    "textual>=0.50.0",
]

[project.scripts]
cloudshell-vpn = "cloudshell_vpn.__main__:main"

[project.urls]
Homepage = "https://github.com/guyon-it-consulting/cloudshell-vpn"
Repository = "https://github.com/guyon-it-consulting/cloudshell-vpn"

[tool.hatch.build.targets.wheel]
packages = ["cloudshell_vpn"]

[tool.hatch.build.targets.wheel.force-include]
"my-additional-models" = "cloudshell_vpn/my-additional-models"
